<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site's signal in miniature: one input fans out to two nodes and
       converges on a bright output node, glowing cyan to mint like the page. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#0e1c3a" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="54">
      <stop offset="0%" stop-color="#4be0ff" />
      <stop offset="100%" stop-color="#7cffb0" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#7cffb0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7cffb0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#4be0ff" stroke-opacity="0.25" stroke-width="1.5" />
  <g fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round">
    <path d="M32 14 C32 22 16 21 16 31" />
    <path d="M32 14 C32 22 48 21 48 31" />
    <path d="M16 31 C16 41 32 40 32 48" />
    <path d="M48 31 C48 41 32 40 32 48" />
  </g>
  <circle cx="32" cy="14" r="5.5" fill="#4be0ff" />
  <circle cx="16" cy="31" r="5.5" fill="url(#wire)" />
  <circle cx="48" cy="31" r="5.5" fill="url(#wire)" />
  <circle cx="32" cy="49" r="13" fill="url(#halo)" />
  <circle cx="32" cy="49" r="6.5" fill="#f2fff8" />
</svg>
